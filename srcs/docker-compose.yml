
services:
  my_mariadb:
    build: ./requirements/mariadb/
    image: my_mariadb:inception
    container_name: my_mariadb
    volumes:
      - db_vol:/var/lib/mysql
    networks:
      - inception_net
    environment:
      MARIADB_USER: $MARIADB_USER
      MARIADB_DATABASE: $MARIADB_DATABASE
    secrets:
      - db_root_password
      - db_password
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  my_wordpress:
    build: ./requirements/wordpress/
    image: my_wordpress:inception
    container_name: my_wordpress
    volumes:
      - wp_vol:/var/www/wordpress
    networks:
      - inception_net
    environment:
      DOMAIN_NAME: $DOMAIN_NAME
      WP_DB_HOST: my_mariadb
      WP_DB_USER: $MARIADB_USER
      WP_DB_NAME: $MARIADB_DATABASE
      WP_TITLE: $WORDPRESS_TITLE
      WP_ADMIN: $WORDPRESS_ADMIN_NAME
      WP_ADMIN_EMAIL: $WORDPRESS_ADMIN_EMAIL
      WP_USER: $WORDPRESS_USER_NAME
      WP_USER_EMAIL: $WORDPRESS_USER_EMAIL
    secrets:
      - db_password
      - wp_user_password
      - wp_admin_password
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - my_mariadb

  my_nginx:
    build: ./requirements/nginx/
    image: my_nginx:inception
    container_name: my_nginx
    volumes:
      - wp_vol:/var/www/wordpress
    networks:
      - inception_net
    ports:
      - 443:443
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    restart: unless-stopped
    depends_on:
      - my_wordpress

networks:
  inception_net:
    driver: bridge
    name: inception-net

volumes:
  db_vol:
    name: inception_database
    driver: local
    driver_opts:
      type: none
      device: ${VOLUMES_PATH}/mariadb
      o: bind 
  wp_vol:
    name: wordpress_database
    driver: local
    driver_opts:
      type: none
      device: ${VOLUMES_PATH}/wordpress
      o: bind 

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_user_password:
    file: ../secrets/wp_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
