services:
  my_mariadb:
    build: ./requirements/mariadb/
    image: my_mariadb:inception
    volumes:
      - db_vol:/var/lib/mysql
    networks:
      - inception_net
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_USER: $USER_NAME
      MARIADB_DATABASE: $DATABASE_NAME
    secrets:
      - db_root_password
      - db_password

  my_wordpress:
    build: ./requirements/wordpress/
    image: my_wordpress:inception
    networks:
      - inception_net
    environment:
      WORDPRESS_DB_HOST: my_mariadb
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_DB_USER: $USER_NAME
      WORDPRESS_DB_NAME: $DATABASE_NAME
    secrets:
      - db_password
    
  my_nginx:
    build: ./requirements/nginx
    image: my_nginx:inception
    networks:
      - inception_net
    ports:
      # - 80:80
      - 443:443

networks:
  inception_net:
    driver: bridge

volumes:
  db_vol:
    name: inception_database
    # driver: local
    # driver_opts:
    #   type: none
    #   device: ${VOLUME_PATH}/database
    #   o: bind 
  wp_vol:
    name: wordpress_database

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
